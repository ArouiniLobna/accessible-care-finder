services:
  postgres:
    image: postgres:17-alpine
    container_name: care-finder-postgres
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_DB: care_finder
    ports:
      - '5432:5432'
    volumes:
      - care-finder-pgdata:/var/lib/postgresql/data
      # Creates the separate test database used by API integration tests.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U care -d care_finder']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  care-finder-pgdata:
